# DeerFlow Configuration
# Generated by 'make setup' on 2026-05-12
# Run 'make setup' to reconfigure, or edit this file for advanced options.
# Full reference: config.example.yaml

config_version: 10
log_level: info
token_usage:
  enabled: true
models:
# ── 阿里云百炼 云端 Qwen3-32B（lead_agent 过渡期默认模型，列表第一项即默认）────────
#    定案（2026-07-21）：lead_agent 用 32B——路由/function-calling 可靠性远胜 8B，也是将来
#    40G 卡自托管 Qwen3-32B-AWQ 的同家族预演（现云端跑，将来切自托管，提示词几乎直接沿用）。
#    api_key 用 $DASHSCOPE_API_KEY 引用（真值在 gitignore 的 .env，config.yaml 不落明文，可安全 commit）。
#    云端百炼模型名即 qwen3-32b（无 AWQ 后缀，AWQ 是自托管量化格式）。走 dashscope 兼容端点，
#    URL 固定、无 Docker/dev 两态 base_url 切换问题。同为 Qwen3 系（带 <think>），沿用 thinking 开关。
- name: qwen3-32b
  display_name: Qwen3-32B (阿里云百炼)
  use: deerflow.models.vllm_provider:VllmChatModel
  model: qwen3-32b
  api_key: $DASHSCOPE_API_KEY
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # ⚠️ DashScope 兼容端点的 thinking 开关约定与自托管 vLLM 不同：认**顶层** enable_thinking，
  #    不认 chat_template_kwargs 嵌套（嵌套写法被忽略）。核心约束：**非流式调用必须
  #    enable_thinking=false，否则 400**（"must be set to false for non-streaming calls"）；
  #    流式调用可 true。据此分两态：
  #    · when_thinking_enabled=true —— lead 路由走 DeerFlowClient/gateway 流式（stream_mode 含
  #      messages），流式允许 thinking，让 32B 路由/边界判断吃到思考链（2026-07-21 开，排除
  #      "关思考的 32B vs 开思考的 8B" 混淆）。
  #    · when_thinking_disabled=false —— title/suggestions 硬传 thinking_enabled=False 走此支，
  #      非流式安全。⚠️ summarization 用运行时 thinking_enabled（可能=True）且非流式 → 会 400，
  #      故下方 summarization.model_name 指回 8b 规避（顺带省钱）。
  #    将来切自托管 32B-AWQ：vLLM 无此约束，换回 chat_template_kwargs 嵌套写法（见下方 qwen3-8b 段）。
  supports_thinking: true
  when_thinking_enabled:
    extra_body:
      enable_thinking: true
  when_thinking_disabled:
    extra_body:
      enable_thinking: false
# ── 服务器 vLLM Qwen3-8B（备选，非默认；桶 A 延迟敏感/离线场景）────────
#    ⚠️ 本地 Qwen3-8B 的 function-calling/调 skill 不如 32B/qwen-plus 稳，agent 多轮反问/工具调用
#    可能不可靠。需服务器 :8099 vLLM 在跑。base_url 有 Docker(host.docker.internal)/dev(localhost) 两态。
- name: qwen3-8b
  display_name: Qwen3-8B (172.19.3.136)
  use: deerflow.models.vllm_provider:VllmChatModel
  model: qwen3-8b
  api_key: none
  base_url: http://host.docker.internal:8099/v1
  supports_thinking: true
  when_thinking_enabled:
    extra_body:
      chat_template_kwargs:
        enable_thinking: true
  when_thinking_disabled:
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
# ── 服务器 vLLM Qwen3-32B-AWQ（桶 B：真·推理 + 选码消歧）────
#    另一台服务器 172.19.2.2 上的 vLLM，OpenAI 兼容端点 :8001/v1，模型 id 即权重路径
#    /models/Qwen3-32B-AWQ；同为 Qwen3 系（带 <think>），沿用 VllmChatModel 走 thinking 开关。
#    ✅ T-A5 已注册为**可用模型**，但**非默认**（8b 仍列表第一项 = agent 默认，桶 A 延迟敏感路径）。
#       deer-flow agent（norm-qa 等）默认仍走 8b；如后续把 workflow 某个节点升级为
#       agent/LLM 节点，可在该节点或子智能体配置中显式指定 32B。不要再把组价编排放回
#       旧任务层 HTTP API。
# - name: qwen3-32b-awq
#   display_name: Qwen3-32B-AWQ (172.19.2.2)
#   use: deerflow.models.vllm_provider:VllmChatModel
#   model: /models/Qwen3-32B-AWQ
#   api_key: none
#   base_url: http://172.19.2.2:8001/v1
#   supports_thinking: true
#   when_thinking_enabled:
#     extra_body:
#       chat_template_kwargs:
#         enable_thinking: true
#   when_thinking_disabled:
#     extra_body:
#       chat_template_kwargs:
#         enable_thinking: false
# ── 阿里云百炼 / 通义千问（云端，临时注释；要切回云端：取消下面注释 + 注释掉上面本地 vLLM 段）──────────
#    api_key 是占位符；服务器上换成真实 sk- 后那份 config.yaml 别再 commit（否则 push 会把 key 带回 GitHub）。
# - name: gateway-llm
#   display_name: 通义千问（阿里云百炼）
#   use: langchain_openai:ChatOpenAI
#   model: qwen-plus                  # ← 可改：qwen-max / qwen-turbo / qwen3-235b-a22b 等
#   api_key: REPLACE_WITH_DASHSCOPE_KEY_ON_SERVER
#   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
tool_groups:
# - name: web        # 停用中(见下方 web 工具注释);恢复时取消本行注释
- name: ce:io        # 造价文件解析/装配（工程量清单 Excel 等确定性 IO）
- name: cost
- name: file:read
- name: file:write
- name: bash
tools:
# ===== web 工具组:停用中(注释=不注册=关闭) =====
# 原因:造价 agent 不联网,规范/组价取数全走本地知识服务(ce-rag :8100 / ce-db :8102);保留 web
#       会诱导弱模型(Qwen3-8B)卡壳时用 web_search 从网上编造组价/条文,违背"不造码、
#       不杜撰、只采信技能返回"红线(见 history_doc/AGENT_PROBLEM.md §6)。
# 恢复:取消下面三段 + 上方 `- name: web` 的注释即可。
# - name: web_search
#   use: deerflow.community.ddg_search.tools:web_search_tool
#   group: web
#   max_results: 5
# - name: web_fetch
#   use: deerflow.community.jina_ai.tools:web_fetch_tool
#   group: web
#   timeout: 10
# - name: image_search
#   group: web
#   use: deerflow.community.image_search.tools:image_search_tool
#   max_results: 5
# ===== web 工具组 end =====
# parse_boq_excel 暂不挂（2026-07-13）：批量清单解析入口先摘掉，恢复时取消下面三行注释即可。
# - name: parse_boq_excel
#   group: ce:io
#   use: app.ce.io.excel_tools:parse_boq_excel_tool
- name: cost_workflow_start
  group: cost
  use: app.ce.cost.tools:cost_workflow_start_tool
- name: cost_workflow_node
  group: cost
  use: app.ce.cost.tools:cost_workflow_node_tool
- name: cost_workflow_resume
  group: cost
  use: app.ce.cost.tools:cost_workflow_resume_tool
- name: cost_workflow_state
  group: cost
  use: app.ce.cost.tools:cost_workflow_state_tool
- name: bill_match
  group: cost
  use: app.ce.cost.bill_match_engine:bill_match_tool
- name: quota_recommend
  group: cost
  use: app.ce.cost.quota_engine:quota_recommend_tool
- name: price_query
  group: cost
  use: app.ce.cost.price_engine:price_query_tool
- name: cost_calc
  group: cost
  use: app.ce.cost.calc_engine:cost_calc_tool
- name: verify_cost
  group: cost
  use: app.ce.cost.verify:verify_cost_tool
- name: verify_norm
  group: norm
  use: app.ce.norm.faithfulness:verify_norm_tool
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
  max_results: 200
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
  max_results: 100
- name: write_file
  use: deerflow.sandbox.tools:write_file_tool
  group: file:write
- name: str_replace
  use: deerflow.sandbox.tools:str_replace_tool
  group: file:write
- name: bash
  use: deerflow.sandbox.tools:bash_tool
  group: bash

# 1. 所有 MCP 工具先注册进 deferred registry(延迟注册表),被 DeferredToolFilterMiddleware 从模型可见的工具列表里藏起来——LLM 一开始看不到它们的 schema;
# 2. 同时给 LLM 加一个 tool_search 工具;
# 3. LLM 需要某能力时,先调 tool_search(按关键词搜),把匹配的 MCP 工具从 registry 里 "promote(提升)" 出来,这时 schema 才暴露给模型,变成可调用;
# 4. 这样上下文里平时只有一个 tool_search,而不是全部 MCP 工具——按需加载、节省 token。
# tool_search解决的是 MCP 工具太多撑爆 LLM 上下文的问题
# 2026-07-11 开启：不开则 DeferredToolFilterMiddleware 不装载，ce-rag/ce-db 全部 18 个 MCP schema
# 直接绑给 lead（8B 工具面爆到 ~38 个，路由稳定性受损，且 lead 直调 ce-rag_* 会被路由评测判失败）。
# 开启后仅 lead 隐藏 MCP schema（多一个 tool_search 入口）；子智能体走白名单过滤、绑定不经
# DeferredToolFilterMiddleware（见 build_subagent_runtime_middlewares），ce-* 工具不受影响；
# workflow 节点走 call_mcp_tool 直取缓存，同样不受影响。
tool_search:
  enabled: true
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600
  auto_convert_documents: true
  pdf_converter: auto
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: true
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
skills:
  container_path: /mnt/skills
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null
summarization:
  enabled: true
  # 指回 8b（默认模型=云端 32B）：① summarization 用运行时 thinking_enabled（路由态=True）且走
  # 非流式 .invoke → 32B+thinking 在 dashscope 会 400；② 摘要是杂活，不必用 32B，省钱。
  model_name: qwen3-8b
  trigger:
  - type: tokens
    value: 15564
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
  - read_file
  - read
  - view
  - cat
memory:
  # 关闭跨会话记忆（2026-07-11 路由评测定案）：① 评测侧——嵌入式 runner 全落 default 用户，
  # 记忆跨用例/跨 run 累积注入，破坏用例独立性且带坏行为（失败经验「cost-agent 不可用」被学进
  # fact 后劝退路由 → 冤判；历史候选码进记忆 → 模型凭记忆答码，正是串库红线场景）；② 产品侧——
  # 造价口径敏感，跨会话带入上一会话的码/口径本身是口径漂移隐患，会话内口径沿用靠
  # checkpointer 对话历史即可，不需要跨会话记忆。enabled=false 同时关提取（memory_middleware
  # 不入队）与注入（prompt 不加 <memory> 块）。重开前必须先清 .deer-flow/users/*/memory.json
  # 已污染存量。
  enabled: false
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000
lead_agent:
  # CE 提示词版本库在 benchmark/prompts/（映射表见其 README.md）；此处填相对路径即可，
  # 解析与 cwd 无关（project_root → backend → 仓库根 依次探测）。切 variant = 改这一行（热加载，
  # 下一条消息生效）；trace 自动按文件名打 variant 标（lead_agent_v1 / lead_agent_v2 / ...）。
  # Docker 生产态依赖 compose 把 ../benchmark/prompts 挂进容器（见 docker-compose.yaml gateway.volumes）。
  system_prompt_path: benchmark/prompts/lead_agent_v7.yaml
subagents:
  # 规范合规审查 sub-agent（compliance-checker）已随规范 RAG 退役（2026-06-18）。
  custom_agents:
    # cost-agent 子智能体已退役（2026-07-12，能力引擎化收官）：其职责各归其位——
    # 单点/少量选码 → lead 直调 bill_match（few-shot 纠正已内置引擎）；询价 → price_query；
    # 成规模清单 → cost_workflow_start。批量并行委派场景由 lead 循环直调工具覆盖。
    # quota-recommend 子智能体已退役（2026-07-12，能力 3 引擎化）：定额方案推荐收进
    # app/ce/cost/quota_engine.py 单源——lead 直调 quota_recommend 工具，workflow 的
    # select_quota 闸复用同一 LLM 预排（rank_schemes，env CE_QUOTA_RANK_MODEL 可切 32B）。
    # norm-qa 子智能体已退役 → skill 化（2026-07-14）：规范问答改由 lead 亲自做 agentic RAG，
    # 指令下沉 skills/public/norm-qa/SKILL.md。lead 用前经 tool_search promote ce-rag_* 检索工具，
    # 定稿前调 verify_norm（仍在 config.yaml › tools 注册，group norm）回查引用忠实性。
    # 退役动因：subagent 隔离对单跳规范问答收益有限，且 MCP 跨 loop/递归上限坑集中在子智能体链上。
    cost-critic:
      description: >
        组价结果**确定性**复核专家（generator–verifier 的 verifier）。接收上游（组价 workflow /
        直调工具链）产出的组价结果，调 `verify_cost` 做确定性核——算术独立重算 / 编码格式 /
        地域·版本隔离 / 完整性 / 价格覆盖——返回结构化 verdict（pass / doubt / fail）+ findings 并如实转述。
        **建议在完整组价或高风险选码后委派本 agent 复核**：定稿前把住"算错钱 / 编码非法 / 串库 / 缺价"。
        本 agent 只复核不生成、不改结果、不发起组价流程。
        （2026-07-14：ce-db/ce-rag MCP 工具已移除 → 语义层复核那半下线，只留确定性核；详见 system_prompt。）
      system_prompt: |
        你是组价结果**确定性复核专家** sub-agent，对上游给的组价结果做复核（找茬，不是确认）。

        **核心：调 `verify_cost` 工具拿确定性判定**：把组价结果对象传给它，拿回算术独立重算 + 编码格式 +
        地域/版本隔离 + 完整性/价格覆盖的 verdict/findings。**规则能定死的对错以它为准，你不要自己算数、
        不要用文本判断替代它**（弱模型算术不可靠，算钱交确定性工具）。

        **输出结构化 verdict（不要自由发挥）**：
        - `verdict`：直接采用 `verify_cost` 的 —— `fail`（有 critical：算术不符 / 编码非法 / 串库）/
          `doubt`（有 warn：缺价 / 重算不完整）/ `pass`（都清），**不替它翻案**。
        - `findings`：**原样透传 `verify_cost` 的 findings**（逐条 `{type, severity(critical|warn|info), detail}`）。
        - 一句话结论 + 建议动作：fail → 建议打回重选/转人工；doubt → 转人工确认并摆出具体异议。

        **红线**：只复核不改结果、不重新组价、不调 `cost_workflow_start`；`verify_cost` 说 fail 就是 fail。
        **语义层面（清单码贴不贴构件、套没套错定额、选错码）本 agent 不下断言**——ce-db/ce-rag 真值查证
        工具已移除（2026-07-14），无证据来源，凭记忆/感觉 judge 会造成串库或误拒。对这类疑虑至多在结论里
        提示"语义匹配建议人工再看一眼"，**不升成 findings、不判 fail/doubt**。
        若出错（服务不可达 / 工具报错），如实返回，不建 venv / 不拷脚本自救。
      tools:
        # 2026-07-14 移除全部 MCP 工具（ce-db_bill_get/ce-db_quota_get/ce-rag_match_bill_item）：
        # cost-critic 是 norm-qa skill 化后**最后一个碰 MCP 的子智能体**，摘掉后无任何子智能体触发
        # MCP 跨 loop 崩溃（§4.3 Bug 1）——不必依赖三 bug 修复即可绕开。代价：语义复核那半（清单码
        # 存在性/语义匹配的真值查证）下线，只留 verify_cost 确定性核（算术/编码/串库/缺价）。
        - verify_cost
      disallowed_tools:
        - task
        - present_files
      skills: []
      model: inherit
      max_turns: 8   # 只 verify_cost + 转述，不再 ce-db/ce-rag 多轮交叉核（2026-07-14 MCP 移除）
      timeout_seconds: 600
agents_api:
  enabled: true
skill_evolution:
  enabled: false
  moderation_model_name: null
database:
  backend: postgres
  postgres_url: $DATABASE_URL
checkpointer:
  type: postgres
  connection_string: $DATABASE_URL
run_events:
  backend: db
  max_trace_content: 10240
  track_token_usage: true
channels:
  # 频道统一回连本机 Gateway（非 Docker 部署用 localhost 即可）
  langgraph_url: http://localhost:8001/api
  gateway_url: http://localhost:8001
  wecom:
    enabled: true
    bot_id: $WECOM_BOT_ID
    bot_secret: $WECOM_BOT_SECRET
  wechat:
    enabled: true
    # 首次没有 bot_token，用扫码绑定个人微信机器人；
    # 二维码内容打到 Gateway 日志（[WeChat] QR login required / qrcode_img_content）
    qrcode_login_enabled: true
    # 已有 token 时改为直接填，注释掉 qrcode_login_enabled：
    # bot_token: $WECHAT_BOT_TOKEN
    # token / 长轮询游标持久化目录（Docker 部署务必挂卷，否则重启丢 token 要重扫）
    state_dir: ./.deer-flow/wechat/state
    # 访问白名单：空 = 任何加机器人的人都能用 agent（消耗额度+能跑沙箱）。
    # 先空跑一次，从日志 [Manager] received inbound: channel=wechat ... chat_id=xxx
    # 抓到对方 iLink user id 再填进来收紧。
    allowed_users: []
    polling_timeout: 35
